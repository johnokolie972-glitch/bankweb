<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <h1 class="text-primary text-center">welcome to bootstrap</h1>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">MySite</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">About</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container">
  <div class="row">
    <div class="col-md-4 bg-primary text-white">Column 1</div>
    <div class="col-md-4 bg-success text-white">Column 2</div>
    <div class="col-md-4 bg-warning text-white">Column 3</div>
  </div>
</div>
<div class="container bg-light p-3">
  <h2>Fixed Container</h2>
</div>
<div class="container-fluid bg-secondary text-white p-3">
  <h2>Fluid Container</h2>
</div>
<button class="btn btn-primary">Primary</button>
<button class="btn btn-success">Success</button>
<button class="btn btn-danger">Danger</button>
<div class="alert alert-warning" role="alert">
  This is a warning alert!
</div>
<div class="btn-group">
  <button class="btn btn-info">Left</button>
  <button class="btn btn-info">Middle</button>
  <button class="btn btn-info">Right</button>
</div>
<form class="p-3">
  <div class="mb-3">
    <label class="form-label">Email</label>
    <input type="email" class="form-control" placeholder="Enter your email">
  </div>
  <button class="btn btn-primary">Submit</button>
</form>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
<i class="bi bi-alarm"></i>
<i class="bi bi-heart-fill text-danger"></i>

</body>
</html>
